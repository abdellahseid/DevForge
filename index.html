    <style>
      body {
        background-color: #050505;
        color: #d4d4d8;
      }
      /* Custom scrollbar for high-density feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
      .terminal-cursor::after {
        content: '▋';
        animation: blink 1s step-start infinite;
        color: #10b981;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      /* Markdown Styles */
      .markdown-body h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: #fff; }
      .markdown-body h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; color: #e4e4e7; margin-top: 1.5rem; }
      .markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: #d4d4d8; margin-top: 1rem; }
      .markdown-body p { margin-bottom: 1rem; line-height: 1.6; color: #a1a1aa; }
      .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
      .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
      .markdown-body code { background: #27272a; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #f59e0b; }
      .markdown-body pre { background: #18181b; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #27272a; }
      .markdown-body pre code { background: transparent; padding: 0; color: #e4e4e7; }
      .markdown-body strong { color: #fff; font-weight: 700; }
      .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #a1a1aa; font-style: italic; }
